<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background: rounded rect slate -->
  <rect width="32" height="32" rx="6" fill="#1e293b"/>
  <!-- Mind map nodes: center + 3 satellites -->
  <!-- Center node -->
  <circle cx="16" cy="16" r="5" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.2"/>
  <!-- Satellite nodes -->
  <circle cx="6" cy="8" r="3.2" fill="#fff"/>
  <circle cx="26" cy="8" r="3.2" fill="#c084fc"/>
  <circle cx="16" cy="27" r="3.2" fill="#22c55e"/>
  <!-- Connecting lines -->
  <line x1="13.2" y1="12.5" x2="7.8" y2="9.5" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="18.8" y1="12.5" x2="24.2" y2="9.5" stroke="#c084fc" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="16" y1="21" x2="16" y2="23.8" stroke="#22c55e" stroke-width="1.4" stroke-linecap="round"/>
</svg>
